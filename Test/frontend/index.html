<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <h1>用户管理系统</h1>
    <span class="mode-badge mock" id="modeBadge">Mock</span>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="搜索用户名或手机号...">
    </div>
    <button class="btn btn-primary" id="btnAdd">+ 新增用户</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:70px">ID</th>
          <th>用户名</th>
          <th>手机号</th>
          <th>邮箱</th>
          <th style="width:170px">创建时间</th>
          <th style="width:120px">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="pagination-bar">
    <div class="pagination-info" id="pageInfo">共 0 条记录</div>
    <div class="pagination-controls" id="paginationControls"></div>
    <div>
      每页
      <select class="page-size-select" id="pageSizeSelect">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
      条
    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="formModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formModalTitle">新增用户</h3>
      <button class="modal-close" id="btnFormClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>用户名<span class="required">*</span></label>
        <input type="text" id="inputUsername" placeholder="请输入用户名" maxlength="50">
        <div class="form-error" id="errorUsername"></div>
      </div>
      <div class="form-group">
        <label>手机号<span class="required">*</span></label>
        <input type="text" id="inputPhone" placeholder="请输入11位手机号" maxlength="11">
        <div class="form-error" id="errorPhone"></div>
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="text" id="inputEmail" placeholder="请输入邮箱（选填）" maxlength="100">
        <div class="form-error" id="errorEmail"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btnFormCancel">取消</button>
      <button class="btn btn-primary" id="formSubmitBtn">确认</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" id="btnDeleteClose">&times;</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="deleteConfirmText"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btnDeleteCancel">取消</button>
      <button class="btn btn-danger" id="btnDeleteConfirm">确认删除</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
